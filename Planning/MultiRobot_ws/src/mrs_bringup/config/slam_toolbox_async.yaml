# Common slam_toolbox (async online) parameters for every UGV in the fleet.
# Frame names, scan topic and namespace are injected per robot from the launch
# file, so this file only carries the mapping/matcher tuning shared by all.
# The `/**` wildcard is deliberate: the node runs inside a per-robot namespace
# (/robot1/slam_toolbox, /robot2/slam_toolbox, ...), so a fixed node key would
# not match. Per-robot values are appended as overrides by the launch file.
/**:
  ros__parameters:
    use_sim_time: true

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.20
    minimum_travel_heading: 0.20
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 1.5
    do_loop_closing: true
    # Loop-closure acceptance is tightened well beyond the stock values. The
    # scenario is a rectangular hall of near-identical aisles, which is a worst
    # case for perceptual aliasing: at the default thresholds the matcher
    # accepts closures between look-alike aisles, and a single false closure
    # rotates part of the pose graph, leaving a duplicated, rotated copy of the
    # environment in the published grid.
    loop_search_maximum_distance: 2.5
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 1.0
    loop_match_minimum_response_coarse: 0.50
    loop_match_minimum_response_fine: 0.60

    # Correlation
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure correlation
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
